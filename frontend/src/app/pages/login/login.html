<main class="access-layout">
  <section class="access-card compact" aria-labelledby="login-title">
    <p class="eyebrow">Hermes</p>
    <h1 id="login-title">Вход в приложение</h1>
    <p class="intro">Введите мастер-пароль владельца. Пароль не покидает этот сервер.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="login-password">Мастер-пароль</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (error(); as message) {
        <p class="form-error" role="alert">{{ message }}</p>
      }
      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Проверяем…' : 'Войти' }}
      </button>
    </form>
  </section>
</main>
