<section class="status-card panel" aria-live="polite">
  <div class="status-heading">
    <span class="status-icon" aria-hidden="true">↔</span>
    <div>
      <p class="eyebrow">Состояние экземпляра</p>
      <h1>Доступность backend</h1>
      <code>GET /api/v1/health</code>
    </div>
  </div>

  @switch (state()) {
    @case ('checking') {
      <p class="status-message checking"><span aria-hidden="true"></span>Проверяем соединение…</p>
    }
    @case ('available') {
      <p class="status-message success">
        <span aria-hidden="true"></span>Backend отвечает: status ok.
      </p>
    }
    @case ('unavailable') {
      <p class="status-message failure">
        <span aria-hidden="true"></span>Backend недоступен. Проверьте локальный сервер.
      </p>
    }
  }

  <button type="button" (click)="check()">Проверить снова</button>
</section>
