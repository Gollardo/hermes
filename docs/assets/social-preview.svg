<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Hermes social preview</title>
  <desc id="description">Hermes logo with the words Self-hosted personal finance and three product qualities.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f5"/>
      <stop offset="1" stop-color="#e8eee9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(160 72) rotate(36) scale(570 380)">
      <stop offset="0" stop-color="#dff1e5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dff1e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#173d32" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <circle cx="1162" cy="96" r="210" fill="#ffffff" opacity="0.32"/>
  <circle cx="1212" cy="578" r="280" fill="#dff1e5" opacity="0.42"/>

  <g transform="translate(112 192)" filter="url(#shadow)">
    <rect width="256" height="256" rx="64" fill="#173d32"/>
    <path d="M68 68v120M188 68v120M72 128h112" fill="none" stroke="#f3efe4" stroke-width="28" stroke-linecap="round"/>
    <circle cx="128" cy="128" r="20" fill="#9fc8ad"/>
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="430" y="257" fill="#0f241d" font-size="92" font-weight="760" letter-spacing="-3">Hermes</text>
    <text x="434" y="323" fill="#17734f" font-size="31" font-weight="700" letter-spacing="3.5">SELF-HOSTED PERSONAL FINANCE</text>
    <text x="434" y="387" fill="#3f4c46" font-size="27" font-weight="500">Exact accounting</text>
    <circle cx="658" cy="378" r="4.5" fill="#9fc8ad"/>
    <text x="681" y="387" fill="#3f4c46" font-size="27" font-weight="500">Purposeful savings</text>
    <circle cx="934" cy="378" r="4.5" fill="#9fc8ad"/>
    <text x="957" y="387" fill="#3f4c46" font-size="27" font-weight="500">Explainable forecasts</text>
  </g>

  <path d="M434 433h646" stroke="#b9c8bf" stroke-width="2"/>
  <text x="434" y="476" fill="#737d77" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="550">Your data stays on your server.</text>
</svg>
